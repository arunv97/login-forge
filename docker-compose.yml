version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: login-forge-db
    restart: always
    environment:
      POSTGRES_USER: user_loginforge
      POSTGRES_PASSWORD: password_loginforge
      POSTGRES_DB: db_loginforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

